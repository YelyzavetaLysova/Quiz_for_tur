<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Tale - Logic Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .pass { background: #d4edda; }
        .fail { background: #f8d7da; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Trail Tale - Application Logic Test</h1>
    
    <div id="test-results"></div>
    
    <h2>Manual Tests</h2>
    <button onclick="testNavigation()">Test Navigation</button>
    <button onclick="testStoryManager()">Test Story Manager</button>
    <button onclick="testTrailSelection()">Test Trail Selection</button>
    
    <script src="js/storyManager.js"></script>
    <script>
        const results = document.getElementById('test-results');
        
        function addTest(name, passed, details = '') {
            const div = document.createElement('div');
            div.className = `test ${passed ? 'pass' : 'fail'}`;
            div.innerHTML = `<strong>${name}:</strong> ${passed ? 'PASS' : 'FAIL'} ${details}`;
            results.appendChild(div);
        }
        
        // Test 1: Check if storyManager is available
        setTimeout(() => {
            addTest('Story Manager Available', !!window.storyManager, 
                window.storyManager ? 'Story manager loaded successfully' : 'Story manager not found');
            
            if (window.storyManager) {
                // Test 2: Check story data
                const stories = window.storyManager.getAvailableStories();
                addTest('Stories Data', stories && stories.length > 0, 
                    `Found ${stories ? stories.length : 0} stories`);
                
                // Test 3: Check language functionality
                const currentLang = window.storyManager.language;
                addTest('Language System', !!currentLang, 
                    `Current language: ${currentLang}`);
                
                // Test 4: Check user progress
                const progress = window.storyManager.userProgress;
                addTest('User Progress', !!progress, 
                    `Points: ${progress?.totalPoints || 0}, Level: ${progress?.currentLevel || 0}`);
            }
        }, 500);
        
        function testNavigation() {
            // Test navigation logic (would need DOM elements)
            addTest('Navigation Test', false, 'Manual test - check browser console');
            console.log('Testing navigation...');
            
            // Simulate screen navigation
            const screens = ['home', 'map', 'history', 'rewards', 'profile'];
            screens.forEach((screen, index) => {
                console.log(`Screen ${index}: ${screen}`);
            });
        }
        
        function testStoryManager() {
            if (!window.storyManager) {
                addTest('Story Manager Test', false, 'Story manager not available');
                return;
            }
            
            try {
                const sm = window.storyManager;
                
                // Test getting story by trail
                const story = sm.getStoryByTrail('Enchanted Forest Loop');
                addTest('Get Story By Trail', !!story, story ? `Found: ${sm.getText(story.title)}` : 'Not found');
                
                // Test AR characters
                const arChars = sm.getARCharacters();
                addTest('AR Characters', !!arChars, `Found ${Object.keys(arChars).length} characters`);
                
                // Test quest system
                const quest = sm.getNextQuest();
                addTest('Quest System', true, quest ? `Next quest: ${sm.getText(quest.title)}` : 'No active quest');
                
            } catch (error) {
                addTest('Story Manager Test', false, `Error: ${error.message}`);
            }
        }
        
        function testTrailSelection() {
            if (!window.storyManager) {
                addTest('Trail Selection Test', false, 'Story manager not available');
                return;
            }
            
            try {
                const stories = window.storyManager.getAvailableStories();
                addTest('Available Stories', stories.length > 0, `Found ${stories.length} stories`);
                
                stories.forEach((story, index) => {
                    const title = window.storyManager.getText(story.title);
                    console.log(`Story ${index + 1}: ${title} (${story.difficulty}, ${story.duration})`);
                });
                
            } catch (error) {
                addTest('Trail Selection Test', false, `Error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
